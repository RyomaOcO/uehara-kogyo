<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <title>造成工事：ショベルカーがダンプに土を積み込む様子</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebfa"/><stop offset="1" stop-color="#f6f9fd"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8cfa5"/><stop offset="1" stop-color="#d2ad7c"/></linearGradient>
    <pattern id="dots" width="34" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#c49a6c" opacity=".55"/><circle cx="23" cy="18" r="1.6" fill="#b88b5c" opacity=".5"/></pattern>
    <pattern id="gravel" width="18" height="12" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#7d8792"/><circle cx="13" cy="9" r="1.6" fill="#6c7681"/></pattern>
    <g id="worker">
      <rect x="-9" y="52" width="8" height="30" rx="3" fill="#13305c"/><rect x="1" y="52" width="8" height="30" rx="3" fill="#13305c"/>
      <rect x="-11" y="78" width="11" height="6" rx="2" fill="#2a2f38"/><rect x="0" y="78" width="11" height="6" rx="2" fill="#2a2f38"/>
      <rect x="-13" y="22" width="26" height="34" rx="7" fill="#1f5aa6"/><rect x="-13" y="38" width="26" height="4" fill="#f4b400"/>
      <circle cx="0" cy="12" r="9" fill="#f2c9a0"/><path d="M-11 10a11 11 0 0 1 22 0z" fill="#f4b400"/><rect x="-13" y="8" width="26" height="3.5" rx="1.5" fill="#f4b400"/>
    </g>
    <g id="cone"><path d="M-10 0 L-3 -30 L3 -30 L10 0z" fill="#f08a24"/><path d="M-7 -12 L7 -12 L5.6 -18 L-5.6 -18z" fill="#fff"/><rect x="-13" y="-3" width="26" height="4" rx="1" fill="#3a3f48"/></g>
    <g id="tree"><rect x="-4" y="-30" width="8" height="30" fill="#8a6a4a"/><circle cx="0" cy="-52" r="28" fill="#8fc3a0"/><circle cx="-14" cy="-40" r="18" fill="#7bb592"/></g>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <g fill="#c9dcf2"><rect x="20" y="150" width="50" height="110"/><rect x="80" y="120" width="40" height="140"/><rect x="470" y="140" width="56" height="120"/><rect x="535" y="170" width="50" height="90"/></g>
  <!-- 地面（左は盛土、右は整地） -->
  <path d="M0 400V210q80-40 160-10t110 50h330v150z" fill="url(#soil)"/>
  <path d="M0 400V210q80-40 160-10t110 50h330v150z" fill="url(#dots)"/>
  <path d="M0 210q80-40 160-10t110 50h330" fill="none" stroke="#a87b52" stroke-width="5"/>
  <g stroke="#c49a6c" stroke-width="3" fill="none" opacity=".8"><path d="M0 290h600"/><path d="M0 345h600"/></g>
  <!-- 丁張り -->
  <g fill="#fff" stroke="#0b2a55" stroke-width="2"><rect x="560" y="214" width="6" height="40"/><rect x="530" y="222" width="46" height="8"/></g>
  <!-- ショベルカー -->
  <g>
    <rect x="60" y="182" width="130" height="24" rx="12" fill="#3a3f48"/>
    <g fill="#6b7480"><circle cx="76" cy="194" r="7"/><circle cx="104" cy="194" r="5"/><circle cx="128" cy="194" r="5"/><circle cx="152" cy="194" r="5"/><circle cx="174" cy="194" r="7"/></g>
    <rect x="72" y="156" width="108" height="28" rx="4" fill="#f4b400"/>
    <path d="M76 156v-46h46l14 46z" fill="#f4b400"/><path d="M84 152v-34h32l10 34z" fill="#bfe0ff"/>
    <rect x="60" y="160" width="16" height="22" rx="3" fill="#d99c00"/>
    <path d="M150 160 L178 130 L240 92 L250 104 L190 146 L166 170z" fill="#f4b400"/>
    <path d="M236 94 L248 88 L300 140 L288 150z" fill="#e3a700"/>
    <path d="M284 146 l22 -12 l16 22 q-16 20 -38 6z" fill="#3a3f48"/>
    <path d="M292 160 q8 6 20 2" stroke="#a87b52" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- ダンプ -->
  <g transform="translate(0 22)">
    <path d="M330 190 l10 -46 h150 l-6 46z" fill="#1f5aa6"/>
    <path d="M346 146 q40 -30 70 -12 q30 -22 64 10z" fill="#c49a6c"/>
    <path d="M490 190 v-52 h44 l20 26 v26z" fill="#0b2a55"/><path d="M500 162 v-18 h28 l14 18z" fill="#bfe0ff"/>
    <rect x="322" y="188" width="236" height="14" rx="3" fill="#3a3f48"/>
    <g fill="#2a2f38"><circle cx="370" cy="210" r="18"/><circle cx="420" cy="210" r="18"/><circle cx="520" cy="210" r="18"/></g>
    <g fill="#9aa3ad"><circle cx="370" cy="210" r="7"/><circle cx="420" cy="210" r="7"/><circle cx="520" cy="210" r="7"/></g>
  </g>
</svg>
