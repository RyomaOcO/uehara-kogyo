<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <title>上下水道工事：道路を掘削し水道管を接続する断面</title>
  <style>.flow{stroke-dasharray:12 18;animation:f 1.4s linear infinite}@keyframes f{to{stroke-dashoffset:-60}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebfa"/><stop offset="1" stop-color="#f6f9fd"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8cfa5"/><stop offset="1" stop-color="#d2ad7c"/></linearGradient>
    <pattern id="dots" width="34" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#c49a6c" opacity=".55"/><circle cx="23" cy="18" r="1.6" fill="#b88b5c" opacity=".5"/></pattern>
    <pattern id="gravel" width="18" height="12" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#7d8792"/><circle cx="13" cy="9" r="1.6" fill="#6c7681"/></pattern>
    <g id="worker">
      <rect x="-9" y="52" width="8" height="30" rx="3" fill="#13305c"/><rect x="1" y="52" width="8" height="30" rx="3" fill="#13305c"/>
      <rect x="-11" y="78" width="11" height="6" rx="2" fill="#2a2f38"/><rect x="0" y="78" width="11" height="6" rx="2" fill="#2a2f38"/>
      <rect x="-13" y="22" width="26" height="34" rx="7" fill="#1f5aa6"/><rect x="-13" y="38" width="26" height="4" fill="#f4b400"/>
      <circle cx="0" cy="12" r="9" fill="#f2c9a0"/><path d="M-11 10a11 11 0 0 1 22 0z" fill="#f4b400"/><rect x="-13" y="8" width="26" height="3.5" rx="1.5" fill="#f4b400"/>
    </g>
    <g id="cone"><path d="M-10 0 L-3 -30 L3 -30 L10 0z" fill="#f08a24"/><path d="M-7 -12 L7 -12 L5.6 -18 L-5.6 -18z" fill="#fff"/><rect x="-13" y="-3" width="26" height="4" rx="1" fill="#3a3f48"/></g>
    <g id="tree"><rect x="-4" y="-30" width="8" height="30" fill="#8a6a4a"/><circle cx="0" cy="-52" r="28" fill="#8fc3a0"/><circle cx="-14" cy="-40" r="18" fill="#7bb592"/></g>
  </defs>
  <rect width="600" height="120" fill="url(#sky)"/>
  <g fill="#c9dcf2"><rect x="30" y="40" width="50" height="80"/><rect x="90" y="20" width="40" height="100"/><rect x="420" y="50" width="60" height="70"/><rect x="490" y="30" width="44" height="90"/></g>
  <use href="#cone" x="160" y="120"/><use href="#cone" x="440" y="120"/>
  <rect y="140" width="600" height="260" fill="url(#soil)"/><rect y="140" width="600" height="260" fill="url(#dots)"/>
  <rect y="120" width="600" height="20" fill="#3d4757"/>
  <rect y="140" width="600" height="18" fill="#9aa3ad"/><rect y="140" width="600" height="18" fill="url(#gravel)" opacity=".6"/>
  <!-- 溝と土留め -->
  <rect x="190" y="120" width="220" height="250" fill="#b98d5e"/>
  <rect x="190" y="120" width="12" height="250" fill="#1f5aa6"/><rect x="398" y="120" width="12" height="250" fill="#1f5aa6"/>
  <g fill="#0b2a55"><rect x="202" y="170" width="196" height="10"/><rect x="202" y="250" width="196" height="10"/></g>
  <!-- 水道管 -->
  <rect y="296" width="600" height="40" fill="#1f5aa6"/><rect y="300" width="600" height="8" fill="#4f8fd8"/>
  <line x1="0" y1="318" x2="600" y2="318" stroke="#bfe3ff" stroke-width="5" stroke-linecap="round" class="flow"/>
  <rect x="290" y="288" width="26" height="56" rx="4" fill="#0b2a55"/>
  <g fill="#f4b400"><circle cx="296" cy="294" r="3"/><circle cx="310" cy="294" r="3"/><circle cx="296" cy="338" r="3"/><circle cx="310" cy="338" r="3"/></g>
  <!-- 作業員 -->
  <g transform="translate(262 212)"><use href="#worker"/></g>
  <g transform="translate(350 212) scale(-1 1)"><use href="#worker"/></g>
  <!-- マンホール -->
  <rect x="490" y="140" width="56" height="200" fill="#b9c1ca"/><rect x="502" y="140" width="32" height="200" fill="#8d96a1"/>
  <g stroke="#e6e9ed" stroke-width="3"><line x1="508" y1="166" x2="528" y2="166"/><line x1="508" y1="196" x2="528" y2="196"/><line x1="508" y1="226" x2="528" y2="226"/><line x1="508" y1="256" x2="528" y2="256"/></g>
  <rect x="484" y="116" width="68" height="7" rx="3" fill="#0b2a55"/>
  <rect x="0" y="372" width="600" height="28" fill="#c49a6c" opacity=".35"/>
</svg>
