<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <title>上原工業の事務所と仲間たち</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebfa"/><stop offset="1" stop-color="#f6f9fd"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8cfa5"/><stop offset="1" stop-color="#d2ad7c"/></linearGradient>
    <pattern id="dots" width="34" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#c49a6c" opacity=".55"/><circle cx="23" cy="18" r="1.6" fill="#b88b5c" opacity=".5"/></pattern>
    <pattern id="gravel" width="18" height="12" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#7d8792"/><circle cx="13" cy="9" r="1.6" fill="#6c7681"/></pattern>
    <g id="worker">
      <rect x="-9" y="52" width="8" height="30" rx="3" fill="#13305c"/><rect x="1" y="52" width="8" height="30" rx="3" fill="#13305c"/>
      <rect x="-11" y="78" width="11" height="6" rx="2" fill="#2a2f38"/><rect x="0" y="78" width="11" height="6" rx="2" fill="#2a2f38"/>
      <rect x="-13" y="22" width="26" height="34" rx="7" fill="#1f5aa6"/><rect x="-13" y="38" width="26" height="4" fill="#f4b400"/>
      <circle cx="0" cy="12" r="9" fill="#f2c9a0"/><path d="M-11 10a11 11 0 0 1 22 0z" fill="#f4b400"/><rect x="-13" y="8" width="26" height="3.5" rx="1.5" fill="#f4b400"/>
    </g>
    <g id="cone"><path d="M-10 0 L-3 -30 L3 -30 L10 0z" fill="#f08a24"/><path d="M-7 -12 L7 -12 L5.6 -18 L-5.6 -18z" fill="#fff"/><rect x="-13" y="-3" width="26" height="4" rx="1" fill="#3a3f48"/></g>
    <g id="tree"><rect x="-4" y="-30" width="8" height="30" fill="#8a6a4a"/><circle cx="0" cy="-52" r="28" fill="#8fc3a0"/><circle cx="-14" cy="-40" r="18" fill="#7bb592"/></g>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <circle cx="500" cy="90" r="40" fill="#fde8a6"/>
  <g fill="#c9dcf2"><rect x="20" y="150" width="50" height="180"/><rect x="80" y="190" width="40" height="140"/><rect x="520" y="170" width="60" height="160"/></g>
  <!-- 事務所 -->
  <rect x="150" y="160" width="250" height="170" fill="#fff"/>
  <rect x="140" y="148" width="270" height="16" fill="#0b2a55"/>
  <rect x="190" y="118" width="170" height="34" fill="#1f5aa6"/>
  <text x="275" y="142" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="4">上原工業</text>
  <g fill="#bfd6f0"><rect x="170" y="186" width="56" height="40"/><rect x="246" y="186" width="56" height="40"/><rect x="322" y="186" width="56" height="40"/><rect x="170" y="246" width="56" height="40"/><rect x="322" y="246" width="56" height="40"/></g>
  <rect x="250" y="250" width="50" height="80" fill="#f4b400"/>
  <!-- トラック -->
  <g>
    <rect x="420" y="268" width="104" height="52" fill="#f7f1e6"/>
    <path d="M524 320v-46h34l20 24v22z" fill="#1f5aa6"/><path d="M532 296v-16h22l12 16z" fill="#bfe0ff"/>
    <g fill="#2a2f38"><circle cx="446" cy="324" r="14"/><circle cx="552" cy="324" r="14"/></g>
    <g fill="#9aa3ad"><circle cx="446" cy="324" r="5"/><circle cx="552" cy="324" r="5"/></g>
  </g>
  <rect y="330" width="600" height="70" fill="url(#soil)"/><rect y="330" width="600" height="70" fill="url(#dots)"/>
  <rect y="326" width="600" height="8" fill="#3d4757"/>
  <g transform="translate(60 244)"><use href="#worker"/></g>
  <g transform="translate(100 244)"><use href="#worker"/></g>
  <g transform="translate(140 244)"><use href="#worker"/></g>
  <use href="#tree" x="420" y="326"/>
</svg>
